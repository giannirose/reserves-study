<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Current Cost</title>
  <link rel="shortcut icon" href="#">
  <link href="./css/style.css" rel="stylesheet" type="text/css">
  <!-- Answers settings.json/components.json requests from an uploaded workbook, when there is one -->
  <script src="./js/studyData.js"></script>
</head>

<body class="current-cost">
  <header>
    <h1 id="pageHeading">Current Cost</h1>
  </header>

  <div class="export-buttons">
    <button id="exportCsvBtn">Export CSV</button>
    <button id="exportExcelBtn">Export Excel</button>
  </div>

  <div id="currentCostTables">
    <!-- One <table class="decade-table"> per 10-year decade (with its own
         <caption>, header row, category rows, component rows, and totals
         row) is added here by currentCost.js, via decadeTables.js. -->
  </div>

  <!-- Shared decade-splitting/table-scaffolding helper, used identically by
       currentCost.js, expenditures.js, and fullyFunded.js -->
  <script src="js/reserves-engine.js" defer></script>
  <script src="js/decadeTables.js" defer></script>
  <!-- Pure calculation logic, no DOM access -->

  <!-- Page-specific rendering logic, runs after the helper + engine load -->
  <script src="js/currentCost.js" defer></script>
  <script src="js/exportUtils.js"></script>

  <script>
    document.getElementById("exportExcelBtn").addEventListener("click", () =>
      exportExcel({
        filename: "Current Cost.xls", sheetName: "CurrentCost",
        title: "Current Cost Balance by Component"
      })
    );
    document.getElementById("exportCsvBtn").addEventListener("click", () =>
      exportCSV({
        filename: "Current Cost.csv",
        title: "Current Cost Balance by Component"
      })
    );
  </script>
</body>

</html>
